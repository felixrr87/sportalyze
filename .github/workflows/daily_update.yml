# .github/workflows/daily_update.yml
# ============================================================
# Scraping automático diario — sin tener el ordenador encendido
# Se ejecuta cada día a las 6:00 AM UTC
# ============================================================

name: 🔄 Daily Data Update

on:
  schedule:
    - cron: "0 6 * * *"   # Cada día a las 6am UTC (7am España)
  workflow_dispatch:        # También se puede ejecutar manualmente

jobs:
  update_data:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Instalar dependencias
        run: pip install -r requirements.txt

      - name: 🔄 Actualizar clasificaciones
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/update_standings.py

      - name: ⚽ Actualizar partidos de hoy
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python scripts/update_matches.py

      - name: 📊 Actualizar stats de jugadores (Understat)
        run: python scripts/update_players.py
        continue-on-error: true  # No fallar si Understat tiene problemas

      - name: 🏥 Actualizar lesiones (Transfermarkt)
        run: python scripts/update_injuries.py
        continue-on-error: true

      - name: ✅ Notificar
        run: echo "✅ Datos actualizados $(date)"
